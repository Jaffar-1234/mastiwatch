var FAV_KEY='mastiwatch_favorites';
function getFavorites(){try{return JSON.parse(localStorage.getItem(FAV_KEY))||[]}catch{return[]}}
function saveFavorites(f){localStorage.setItem(FAV_KEY,JSON.stringify(f))}
function toggleFavorite(id){var f=getFavorites();var idx=f.indexOf(id);if(idx>-1){f.splice(idx,1);showToast('⭐ Removed from favorites')}else{f.push(id);showToast('⭐ Added to favorites')}saveFavorites(f);renderFavorites(G());updateDetailFavBtn(id)}
function isFavorite(id){return getFavorites().indexOf(id)!==-1}
function clearFavorites(){if(confirm('Clear all favorites?')){saveFavorites([]);renderFavorites(G());showToast('⭐ Favorites cleared')}}
function renderFavorites(movies){var grid=document.getElementById('favoritesGrid');var title=document.getElementById('favoritesTitle');var favs=getFavorites();var filtered=movies.filter(function(m){return favs.indexOf(m.id)!==-1&&m.cs!==1});if(filtered.length===0){grid.style.display='none';title.style.display='none';return}title.style.display='flex';grid.style.display='grid';grid.innerHTML=filtered.map(function(m){return buildCard(m)}).join('')}
function updateDetailFavBtn(id){var btn=document.getElementById('detailFavBtn');var txt=document.getElementById('detailFavText');if(!btn)return;if(isFavorite(id)){btn.style.borderColor='#ffd700';btn.style.color='#ffd700';txt.textContent='Remove from Favorites'}else{btn.style.borderColor='rgba(255,255,255,0.06)';btn.style.color='#94a3b8';txt.textContent='Add to Favorites'}}
